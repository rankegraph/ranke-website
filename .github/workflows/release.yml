name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate runs on the tag rather than trusting the run release-cycle.sh
      # made before merging: what is tagged is what gets published, and a tag
      # that cannot build should fail here, where the release is watched.
      - name: Gate
        run: make check

      # site.tar.gz carries index.html as a top-level member, so the host
      # unpacks it straight into its docroot. `make site-bundle` refuses an
      # archive that does not.
      #
      # SITE_VERSION reaches the footer, so a page states the release it belongs
      # to. It is passed rather than derived: the checkout is one commit deep and
      # fetches no tags, so `git describe` inside the Makefile would fall back to
      # a bare hash on the very build that has a real version to state.
      - name: Pack the site
        env:
          TAG: ${{ github.ref_name }}
        run: make site-bundle SITE_VERSION="$TAG"

      # site.tar.gz and site.tar.gz.sha256, the pair the host fetches from
      # /releases/latest/download/.
      #
      # A tag carrying a hyphen is a release candidate and says so: unmarked it
      # would take the repo's "latest release", which is what that URL resolves
      # to.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*

      # The host's listener reads nothing from this body but the signature over
      # it: it fetches the latest release from GitHub itself. So a forged POST
      # buys an attacker one re-fetch of the genuine latest release, and the
      # secret is what keeps even that out of reach.
      #
      # The body is built here and sent with --data-raw, byte for byte what the
      # HMAC covers. A shell that rebuilt it — a pipe through jq, a heredoc that
      # adds a newline — would sign one string and send another.
      #
      # Values reach the shell as environment variables rather than as ${{ }}
      # inside the script, so nothing GitHub supplies is ever parsed as shell.
      #
      # A failed POST delays this deploy by up to fifteen minutes; it does not
      # lose it, because the box polls on a timer of its own. That is why this
      # warns rather than failing the job: the release itself published, and
      # `make release` waits on this run to say whether it did.
      - name: Tell the host to deploy
        id: hook
        env:
          HOOK_URL: https://rankegraph.org/_hooks/website
          HOOK_SECRET: ${{ secrets.WEBSITE_HOOK_SECRET }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "$HOOK_SECRET" ]; then
            echo "::warning::WEBSITE_HOOK_SECRET is unset — the host will pick this release up on its own timer"
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(printf '{"action":"published","release":{"tag_name":"%s"},"repository":{"full_name":"%s"}}' "$TAG" "$REPO")
          mac=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)
          if answer=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST "$HOOK_URL" \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: release' \
              -H "X-Hub-Signature-256: sha256=$mac" \
              --data-raw "$body"); then
            echo "called the deploy hook: $HOOK_URL accepted the signature${answer:+ — $answer}"
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the deploy hook did not answer — the host's timer will fetch this release within fifteen minutes"
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      # Every page states the build it came from, so the site is its own receipt:
      # when the front page says this tag, the host has fetched the release,
      # unpacked it and is serving it. Nothing here trusts the hook's 200 — that
      # only says the listener accepted the trigger.
      #
      # Skipped when nothing was posted, rather than waiting out the host's
      # fifteen-minute timer on a runner.
      #
      # A tag the site never serves warns instead of failing, for the reason the
      # hook step does: the release itself published, its assets are good, and
      # `make release` reads a red run here as a failed release.
      - name: Wait for the site to serve it
        if: steps.hook.outputs.posted == 'true'
        env:
          SITE_URL: https://rankegraph.org/
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          echo "waiting for $SITE_URL to serve $TAG…"
          for attempt in $(seq 1 30); do
            # The query string defeats any cache between here and the docroot;
            # a static file ignores it.
            page=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "$SITE_URL?deploy-check=$TAG.$attempt" || true)
            # -F, because a version string is full of regex metacharacters. The
            # trailing '<' pins the match to the whole tag: v0.1.0 must not
            # answer for v0.1.10.
            if printf '%s' "$page" | grep -Fq "Built from $TAG<"; then
              echo "website $TAG is now online — $SITE_URL"
              exit 0
            fi
            echo "  not yet (attempt $attempt/30)"
            sleep 10
          done
          echo "::warning::$SITE_URL is not serving $TAG after five minutes — the host's timer will retry"
